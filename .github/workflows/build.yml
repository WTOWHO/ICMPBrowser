name: Build ICMPBrowser

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build proxy and browser
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          for d in cmd/*; do
            NAME=$(basename "$d")
            ENTRY=""
            if [ -f "$d/main.go" ]; then
              ENTRY="$d/main.go"
            elif [ -f "$d/server.go" ]; then
              ENTRY="$d/server.go"
            else
              continue
            fi
            OUT="icmpbrowser-${NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
            if [ "${{ matrix.goos }}" = "windows" ]; then
              OUT="${OUT}.exe"
            fi
            echo ">>> Building $NAME from $ENTRY"
            go build -ldflags="-s -w" -o "$OUT" "$ENTRY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: icmpbrowser-${{ matrix.goos }}-${{ matrix.goarch }}
          path: icmpbrowser-*
