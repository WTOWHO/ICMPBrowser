name: Build ICMPBrowser

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 智能编译步骤：自动寻找 main.go 入口并编译
      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # 自动在整个仓库中寻找 main.go 所在的文件夹
          MAIN_DIR=$(find . -name "main.go" -not -path "*/vendor/*" | head -n 1 | xargs dirname)
          if [ -z "$MAIN_DIR" ]; then
            echo "Error: 找不到 main.go 文件！"
            exit 1
          fi
          echo "找到入口文件，位于: $MAIN_DIR"
          
          # 准备输出文件名
          OUT_NAME="icmpbrowser-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUT_NAME="${OUT_NAME}.exe"
          fi

          # 执行 Go 编译
          go build -ldflags="-s -w" -o "$OUT_NAME" "$MAIN_DIR"

      # 上传编译好的成果
      - uses: actions/upload-artifact@v4
        with:
          name: icmpbrowser-${{ matrix.goos }}-${{ matrix.goarch }}
          path: icmpbrowser-*
